<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 1100" role="img" aria-labelledby="cluster-mkt-dark-title cluster-mkt-dark-description">
  <title id="cluster-mkt-dark-title">Cluster MKT dimensional dark mark</title>
  <desc id="cluster-mkt-dark-description">Eight overlapping matte spheres with subtly strengthened forest-green and ink-blue edge separation for dark surfaces.</desc>
  <defs>
    <radialGradient id="gradient-dark-rear-top-rust-sphere" cx="31%" cy="25%" r="76%">
      <stop offset="0" stop-color="#D08A76"/>
      <stop offset="0.52" stop-color="#B46753"/>
      <stop offset="1" stop-color="#82483A"/>
    </radialGradient>
    <radialGradient id="gradient-dark-back-left-rust-sphere" cx="33%" cy="27%" r="78%">
      <stop offset="0" stop-color="#C27661"/>
      <stop offset="0.56" stop-color="#A2523E"/>
      <stop offset="1" stop-color="#75382B"/>
    </radialGradient>
    <radialGradient id="gradient-dark-back-right-sage-sphere" cx="32%" cy="25%" r="78%">
      <stop offset="0" stop-color="#D2DBC9"/>
      <stop offset="0.56" stop-color="#B2C0AA"/>
      <stop offset="1" stop-color="#869783"/>
    </radialGradient>
    <radialGradient id="gradient-dark-upper-forest-sphere" cx="32%" cy="25%" r="79%">
      <stop offset="0" stop-color="#587A6C"/>
      <stop offset="0.52" stop-color="#315B4C"/>
      <stop offset="0.88" stop-color="#1D4538"/>
      <stop offset="1" stop-color="#183D33"/>
    </radialGradient>
    <radialGradient id="gradient-dark-right-rust-sphere" cx="33%" cy="27%" r="78%">
      <stop offset="0" stop-color="#D4816C"/>
      <stop offset="0.55" stop-color="#B96450"/>
      <stop offset="1" stop-color="#884737"/>
    </radialGradient>
    <radialGradient id="gradient-dark-small-left-sage-sphere" cx="31%" cy="24%" r="79%">
      <stop offset="0" stop-color="#C6D1C0"/>
      <stop offset="0.55" stop-color="#A1B39D"/>
      <stop offset="1" stop-color="#778A75"/>
    </radialGradient>
    <radialGradient id="gradient-dark-front-ink-sphere" cx="32%" cy="25%" r="80%">
      <stop offset="0" stop-color="#66758F"/>
      <stop offset="0.54" stop-color="#3B4964"/>
      <stop offset="0.88" stop-color="#29364E"/>
      <stop offset="1" stop-color="#232F46"/>
    </radialGradient>
    <radialGradient id="gradient-dark-front-ochre-sphere" cx="32%" cy="24%" r="78%">
      <stop offset="0" stop-color="#EAC075"/>
      <stop offset="0.55" stop-color="#D8A34F"/>
      <stop offset="1" stop-color="#A16E2D"/>
    </radialGradient>

    <linearGradient id="gradient-dark-matte-ambient-light" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.15"/>
      <stop offset="0.46" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="1" stop-color="#050B09" stop-opacity="0.10"/>
    </linearGradient>
    <radialGradient id="gradient-dark-upper-forest-matte-mask" cx="30%" cy="23%" r="68%">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="0.58" stop-color="#FFFFFF" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gradient-dark-front-ink-matte-mask" cx="31%" cy="24%" r="70%">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.8"/>
      <stop offset="0.6" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <mask id="mask-dark-upper-forest-matte" maskUnits="userSpaceOnUse" x="209" y="68" width="462" height="462">
      <circle cx="440" cy="299" r="231" fill="url(#gradient-dark-upper-forest-matte-mask)"/>
    </mask>
    <mask id="mask-dark-front-ink-matte" maskUnits="userSpaceOnUse" x="287" y="541" width="482" height="482">
      <circle cx="528" cy="782" r="241" fill="url(#gradient-dark-front-ink-matte-mask)"/>
    </mask>

    <clipPath id="clip-dark-back-left-rust-contact-shadow"><circle cx="278" cy="557" r="194"/></clipPath>
    <clipPath id="clip-dark-back-right-sage-contact-shadow"><circle cx="819" cy="707" r="196"/></clipPath>
    <clipPath id="clip-dark-upper-forest-contact-shadow"><circle cx="440" cy="299" r="231"/></clipPath>
    <clipPath id="clip-dark-right-rust-contact-shadow"><circle cx="823" cy="419" r="197"/></clipPath>
    <clipPath id="clip-dark-front-ink-contact-shadow"><circle cx="528" cy="782" r="241"/></clipPath>

    <filter id="filter-cluster-ground-shadow-dark" x="-30%" y="-50%" width="160%" height="210%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="27"/>
    </filter>
    <filter id="filter-sphere-contact-shadow-dark" x="-40%" y="-40%" width="180%" height="180%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="11"/>
    </filter>
    <filter id="filter-sphere-edge-softness-dark" x="-4%" y="-4%" width="108%" height="108%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="0.35" result="softAlpha"/>
      <feComposite in="SourceGraphic" in2="softAlpha" operator="in"/>
    </filter>
  </defs>

  <ellipse id="cluster-ground-shadow-dark" cx="574" cy="1009" rx="379" ry="39" fill="#000000" opacity="0.32" filter="url(#filter-cluster-ground-shadow-dark)"/>

  <g id="sphere-layer-dark-rear-top-rust">
    <circle id="sphere-dark-rear-top-rust" data-sphere="rear-top-rust" data-stack="1" cx="715" cy="185" r="115" fill="url(#gradient-dark-rear-top-rust-sphere)"/>
    <circle id="sphere-dark-rear-top-rust-ambient" cx="715" cy="185" r="115" fill="url(#gradient-dark-matte-ambient-light)" opacity="0.34"/>
  </g>
  <g id="sphere-layer-dark-back-left-rust">
    <circle id="sphere-dark-back-left-rust" data-sphere="back-left-rust" data-stack="2" cx="278" cy="557" r="194" fill="url(#gradient-dark-back-left-rust-sphere)"/>
    <circle id="sphere-dark-back-left-rust-ambient" cx="278" cy="557" r="194" fill="url(#gradient-dark-matte-ambient-light)" opacity="0.26"/>
  </g>
  <g id="sphere-layer-dark-back-right-sage">
    <circle id="sphere-dark-back-right-sage" data-sphere="back-right-sage" data-stack="3" cx="819" cy="707" r="196" fill="url(#gradient-dark-back-right-sage-sphere)"/>
    <circle id="sphere-dark-back-right-sage-ambient" cx="819" cy="707" r="196" fill="url(#gradient-dark-matte-ambient-light)" opacity="0.26"/>
  </g>

  <ellipse id="contact-shadow-dark-upper-forest-on-back-left-rust" cx="442" cy="459" rx="91" ry="56" transform="rotate(31 442 459)" fill="#07100C" opacity="0.31" clip-path="url(#clip-dark-back-left-rust-contact-shadow)" filter="url(#filter-sphere-contact-shadow-dark)"/>
  <g id="sphere-layer-dark-upper-forest" filter="url(#filter-sphere-edge-softness-dark)">
    <circle id="sphere-dark-upper-forest" data-sphere="upper-forest" data-stack="4" cx="440" cy="299" r="231" fill="url(#gradient-dark-upper-forest-sphere)" stroke="#749789" stroke-width="3.5" stroke-opacity="0.34"/>
    <circle id="sphere-dark-upper-forest-ambient" cx="440" cy="299" r="231" fill="url(#gradient-dark-matte-ambient-light)" opacity="0.48" mask="url(#mask-dark-upper-forest-matte)"/>
  </g>

  <ellipse id="contact-shadow-dark-right-rust-on-back-right-sage" cx="813" cy="584" rx="118" ry="50" transform="rotate(3 813 584)" fill="#080705" opacity="0.25" clip-path="url(#clip-dark-back-right-sage-contact-shadow)" filter="url(#filter-sphere-contact-shadow-dark)"/>
  <ellipse id="contact-shadow-dark-right-rust-on-upper-forest" cx="677" cy="359" rx="54" ry="93" transform="rotate(-27 677 359)" fill="#060A08" opacity="0.19" clip-path="url(#clip-dark-upper-forest-contact-shadow)" filter="url(#filter-sphere-contact-shadow-dark)"/>
  <g id="sphere-layer-dark-right-rust">
    <circle id="sphere-dark-right-rust" data-sphere="right-rust" data-stack="5" cx="823" cy="419" r="197" fill="url(#gradient-dark-right-rust-sphere)"/>
    <circle id="sphere-dark-right-rust-ambient" cx="823" cy="419" r="197" fill="url(#gradient-dark-matte-ambient-light)" opacity="0.3"/>
  </g>

  <g id="sphere-layer-dark-small-left-sage">
    <circle id="sphere-dark-small-left-sage" data-sphere="small-left-sage" data-stack="6" cx="224" cy="756" r="95" fill="url(#gradient-dark-small-left-sage-sphere)"/>
    <circle id="sphere-dark-small-left-sage-ambient" cx="224" cy="756" r="95" fill="url(#gradient-dark-matte-ambient-light)" opacity="0.3"/>
  </g>

  <ellipse id="contact-shadow-dark-front-ink-on-back-left-rust" cx="405" cy="703" rx="118" ry="58" transform="rotate(35 405 703)" fill="#06080A" opacity="0.29" clip-path="url(#clip-dark-back-left-rust-contact-shadow)" filter="url(#filter-sphere-contact-shadow-dark)"/>
  <ellipse id="contact-shadow-dark-front-ink-on-back-right-sage" cx="690" cy="806" rx="101" ry="63" transform="rotate(-20 690 806)" fill="#06090B" opacity="0.25" clip-path="url(#clip-dark-back-right-sage-contact-shadow)" filter="url(#filter-sphere-contact-shadow-dark)"/>
  <g id="sphere-layer-dark-front-ink" filter="url(#filter-sphere-edge-softness-dark)">
    <circle id="sphere-dark-front-ink" data-sphere="front-ink" data-stack="7" cx="528" cy="782" r="241" fill="url(#gradient-dark-front-ink-sphere)" stroke="#75849D" stroke-width="3.5" stroke-opacity="0.36"/>
    <circle id="sphere-dark-front-ink-ambient" cx="528" cy="782" r="241" fill="url(#gradient-dark-matte-ambient-light)" opacity="0.46" mask="url(#mask-dark-front-ink-matte)"/>
  </g>

  <ellipse id="contact-shadow-dark-front-ochre-on-upper-forest" cx="563" cy="432" rx="104" ry="52" transform="rotate(44 563 432)" fill="#070805" opacity="0.21" clip-path="url(#clip-dark-upper-forest-contact-shadow)" filter="url(#filter-sphere-contact-shadow-dark)"/>
  <ellipse id="contact-shadow-dark-front-ochre-on-right-rust" cx="706" cy="497" rx="104" ry="48" transform="rotate(-28 706 497)" fill="#0C0805" opacity="0.21" clip-path="url(#clip-dark-right-rust-contact-shadow)" filter="url(#filter-sphere-contact-shadow-dark)"/>
  <ellipse id="contact-shadow-dark-front-ochre-on-front-ink" cx="589" cy="671" rx="118" ry="51" transform="rotate(4 589 671)" fill="#050608" opacity="0.28" clip-path="url(#clip-dark-front-ink-contact-shadow)" filter="url(#filter-sphere-contact-shadow-dark)"/>
  <g id="sphere-layer-dark-front-ochre">
    <circle id="sphere-dark-front-ochre" data-sphere="front-ochre" data-stack="8" cx="628" cy="536" r="168" fill="url(#gradient-dark-front-ochre-sphere)"/>
    <circle id="sphere-dark-front-ochre-ambient" cx="628" cy="536" r="168" fill="url(#gradient-dark-matte-ambient-light)" opacity="0.3"/>
  </g>
</svg>
